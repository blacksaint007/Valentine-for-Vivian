<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Vivian ❤️</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body id="bodyBg">

    <div id="loader">
        <div class="heart-loader"></div>
        <p>Hey Love, I have just a simple question for You🤭...</p>
    </div>

    <div class="container">
        <div class="glass-card" id="mainCard">
            <div class="image-wrapper">
                <img src="https://gifdb.com/images/high/cute-love-bear-roses-ou7zho5oosxnpo6k.gif" alt="Cute Bears" class="main-gif" id="displayImg">
            </div>
            
            <h1 id="heading">Will you be my Valentine, Vivian? ❤️</h1>
            
            <div class="btn-group" id="btnGroup">
                <button id="yesBtn">YES!</button>
                <button id="noBtn">No</button>
            </div>
        </div>
    </div>

    <audio id="vibeMusic" loop>
        <source src="https://cdn.trendybeatz.com/audio/Omah-Lay-You-%5BTrendyBeatz.com%5D.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
